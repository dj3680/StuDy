<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment successful — StuDy</title>
<style>
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#fafafa;color:#141414;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
  .card{background:#fff;border:1px solid #e6e6e6;border-radius:16px;max-width:400px;width:100%;padding:28px 22px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.06)}
  .tick{width:64px;height:64px;border-radius:50%;background:#e9f9ef;color:#16a34a;font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
  h1{font-size:20px;margin:0 0 8px}
  p{color:#70757d;font-size:14px;line-height:1.55;margin:0 0 18px}
  .btn{display:block;width:100%;box-sizing:border-box;background:#e3a924;color:#141414;font-weight:800;font-size:15.5px;border:none;border-radius:12px;padding:14px;cursor:pointer;text-decoration:none}
  .amt{font-size:26px;font-weight:900;margin:2px 0 10px}
</style>
</head>
<body>
<div class="card">
  <div class="tick">✓</div>
  <h1>Payment successful!</h1>
  <div class="amt" id="amt"></div>
  <p id="msg">Your payment is confirmed by the payment gateway. Tap the button below to add it to your StuDy account — you will be taken back to the app.</p>
  <button class="btn" id="go">Add to my StuDy account</button>
</div>
<script>
  var claim = null;
  try{ claim = JSON.parse(localStorage.getItem("study_payclaim") || "null"); }catch(e){}
  if(!claim){
    var qs = new URLSearchParams(location.search);
    if(qs.get("amt")) claim = { id:null, kind: qs.get("kind") || "wallet", amount: qs.get("amt") };
  }
  if(claim){
    document.getElementById("amt").textContent = claim.kind === "sub" ? "StuDy Premium — 1 year" : "₹" + claim.amount;
    document.getElementById("go").textContent = claim.kind === "sub" ? "Activate my Premium" : "Add ₹" + claim.amount + " to my wallet";
  } else {
    document.getElementById("msg").textContent = "Your payment is confirmed. Open the StuDy app — if the balance does not appear, contact us from the app and we will fix it right away.";
    document.getElementById("go").textContent = "Open StuDy";
  }
  document.getElementById("go").addEventListener("click", function(){
    if(claim && claim.id){ try{ localStorage.setItem("study_payok", JSON.stringify({id: claim.id, at: Date.now()})); }catch(e){} }
    location.href = "index.html";
  });
</script>
</body>
</html>
